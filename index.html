<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Event Scanner</title>

  <!-- Styles -->
  <link rel="stylesheet" href="style.css" />

  <!-- QR scanner library -->
  <script src="https://unpkg.com/html5-qrcode"></script>
</head>
<body>
  <header class="topbar">
    <!-- Responsive logo (swap src to your logo path if different) -->
    <img src="images/logo.png" alt="Event Logo" class="logo" />
  </header>

  <main id="scanner-container">
    <!-- Camera box -->
    <div id="reader" aria-label="QR camera view"></div>

    <!-- Controls + info -->
    <div class="controls">
      <button id="scanBtn" type="button">Scan</button>
      <div id="guestCount" class="circle" aria-live="polite">0</div>
      <button id="confirmBtn" type="button" title="Confirm check-in" disabled>✔</button>
    </div>

    <!-- Status (persists), then guest info (always visible) -->
    <div id="status" class="status" aria-live="polite">Ready</div>

    <div class="info-row">
      <div class="info-block">
        <div class="info-label">Guest</div>
        <div id="attendee" class="info-value">—</div>
      </div>
      <div class="info-block">
        <div class="info-label">Guests with them</div>
        <div id="companions" class="info-value">0</div>
      </div>
    </div>
  </main>

  <!-- App logic -->
  <script src="script.js"></script>
</body>
</html>
