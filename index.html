<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Event Scanner</title>

  <!-- Styles -->
  <link rel="stylesheet" href="style.css" />

  <!-- QR scanner library -->
  <script src="https://unpkg.com/html5-qrcode"></script>
</head>
<body>
  <header class="topbar">
    <!-- Responsive logo (swap src to your logo path if different) -->
    <img src="images/logo.png" alt="Event Logo" class="logo" />
  </header>

  <main id="scanner-container">
    <!-- Camera box -->
    <div id="reader" aria-label="QR camera view"></div>

    <!-- Controls + info -->
    <div class="controls">
      <button id="scanBtn" type="button">Scan</button>
      <div id="guestCount" class="circle" aria-live="polite">0</div>
      <button id="confirmBtn" type="button" title="Confirm check-in" disabled>✔</button>
    </div>

    <!-- Status + guest info (persisting until next scan) -->
    <div id="status" class="status" aria-live="polite">Ready</div>
    <div id="attendee" class="attendee"></div>
  </main>

  <!-- Web Audio context is created in JS; this <audio> is optional fallback if you want a file later -->
  <!-- <audio id="beep" src="beep.mp3" preload="auto"></audio> -->

  <!-- App logic -->
  <script src="script.js"></script>
</body>
</html>
